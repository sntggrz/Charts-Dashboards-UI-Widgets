<!DOCTYPE html>
<html lang="en" style="height: 100%">
  <head>
    <title>Ring Gauges</title>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #container {
        height: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="container" style="height: 100%"></div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

    <script type="text/javascript">
      var dom = document.getElementById('container');
      var myChart = echarts.init(dom, null, {
        renderer: 'canvas',
        useDirtyRect: false,
      });

      var totalMatPrima = 2000;
      var totalMaquina = 3000;
      var totalManoObra = 0;

      var total = 50000;

      var totalCosto = totalMatPrima + totalMaquina + totalManoObra;

      var formattedTotal = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(total);

      var formattedCosto = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(totalCosto);

      var utilidad = total - totalCosto;

      var formattedUtilidad = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(utilidad);

      var option;

      const values = [
        { name: 'Materia Prima', value: totalMatPrima, color: '#FF0800' },
        { name: 'Mano de obra', value: totalManoObra, color: '#2E8B57' },
        { name: 'Maquinaria/Flete', value: totalMaquina, color: '#00A7FF' },
      ];

      values.sort((a, b) => b.value - a.value);

      const nonZeroValues = values.filter((v) => v.value > 0);

      let cumulative = 0;
      const gaugeData = nonZeroValues.map((item, index) => {
        cumulative += item.value;
        const offsetY = -90 + index * 60;
        return {
          name: item.name,
          value: cumulative,
          itemStyle: {
            color: item.color,
          },
          title: {
            offsetCenter: ['190%', `${offsetY}%`],
          },
          detail: {
            offsetCenter: ['190%', `${offsetY + 18}%`],
            color: item.color,
            borderColor: item.color,
            borderWidth: 1,
            borderRadius: 20,
            backgroundColor: 'transparent',
            formatter: function () {
              return (
                '$' +
                new Intl.NumberFormat('en-US', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2,
                }).format(item.value)
              );
            },
          },
        };
      });

      option = {
        title: [
          {
            text: 'Ventas: $' + formattedTotal,
            left: 'center',
            top: 0,
            textStyle: {
              fontSize: 17,
              fontWeight: 'bold',
              lineHeight: 20,
            },
          },
          {
            text: 'Utilidad: $' + formattedUtilidad,
            left: 'center',
            top: '90%',
            textStyle: {
              fontSize: 15,
              fontWeight: 'normal',
              lineHeight: 19,
            },
          },
        ],
        series: [
          {
            type: 'gauge',
            center: ['30%', '55%'],
            radius: '60%',
            max: totalCosto,
            pointer: {
              show: false,
            },
            progress: {
              show: total > 0,
              overlap: true,
              roundCap: true,
              clip: false,
              itemStyle: {
                borderWidth: 1,
                borderColor: '#464646',
              },
            },
            axisLine: {
              show: total > 0,
              roundCap: true,
              lineStyle: {
                width: 10,
              },
            },
            splitLine: {
              show: false,
              distance: 0,
              length: 10,
            },
            axisTick: {
              show: false,
            },
            axisLabel: {
              show: false,
              distance: 15,
            },
            data: gaugeData,
            title: {
              fontSize: 13,
            },
            detail: {
              width: 100,
              height: 14,
              fontSize: 14,
              color: 'inherit',
              borderColor: 'inherit',
              borderRadius: 20,
              borderWidth: 1,
              formatter: function (value) {
                return (
                  '$' +
                  new Intl.NumberFormat('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                  }).format(value)
                );
              },
            },
          },
        ],
      };

      if (option && typeof option === 'object') {
        myChart.setOption(option);
      }

      window.addEventListener('resize', myChart.resize);
    </script>
  </body>
</html>
