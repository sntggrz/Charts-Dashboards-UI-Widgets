<!DOCTYPE html>
<html lang="en" style="height: 100%">
  <head>
    <title>Half Donut</title>
    <meta charset="utf-8" />
  </head>
  <body style="height: 100%; margin: 0">
    <div id="container" style="width: 100%; height: 100%; margin: auto"></div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

    <script type="text/javascript">
      var dom = document.getElementById('container');
      var myChart = echarts.init(dom, null, {
        renderer: 'canvas',
        useDirtyRect: false,
      });
      var app = {};

      var option;

      option = {
        tooltip: {
          trigger: 'item',
        },
        legend: {
          show: true,
          textStyle: {
            fontSize: 24,
          },
        },
        series: [
          {
            name: 'Cotizaciones',
            type: 'pie',
            radius: ['50%', '60%'],
            center: ['50%', '55%'],
            startAngle: 0,
            endAngle: 360,
            padAngle: 4,
            itemStyle: {
              borderRadius: 10,
            },
            label: {
              show: false,
              textStyle: {
                fontSize: 24,
              },
              formatter: function (params) {
                return `${Math.round(params.percent)}%`;
              },
            },
            data: [
              {
                value: 1048,
                name: 'Aprovadas',
                itemStyle: { color: '#4caf50' },
              },
              {
                value: 735,
                name: 'Rechazadas',
                itemStyle: { color: '#f44336' },
              },
            ],
          },
        ],
      };

      if (option && typeof option === 'object') {
        myChart.setOption(option);
      }

      window.addEventListener('resize', myChart.resize);
    </script>
  </body>
</html>
